name: Update EMCI TV Afrique playlist
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh M3U
        run: python update_emci.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- EMCI-TV.m3u; then
            echo 'No change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EMCI-TV.m3u
          git commit -m 'Refresh EMCI TV Afrique HLS URL'
          git push
