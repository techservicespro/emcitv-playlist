
name: Update EMCI TV Afrique playlist

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update EMCI TV playlist
        run: python update_emci.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMCI-TV.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Update EMCI TV Afrique stream"
            git push
          fi
