name: Update EMCI TV Afrique playlist

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: emci-tv-playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Update EMCI TV playlist
        run: python update_emci.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EMCI-TV.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Update EMCI TV Afrique stream"
            git push
          else
            echo "No playlist changes to commit"
          fi
